<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Edge latency benchmark</title>
  <desc id="desc">Inference path latency simulation</desc>
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#172420" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef5f1"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="#f7faf7"/>
  <rect x="28" y="28" width="904" height="484" rx="20" fill="url(#paper)" stroke="#d8e3de" filter="url(#softShadow)"/>
  <text x="60" y="72" fill="#172420" font-family="Georgia, serif" font-size="26" font-weight="700">Edge latency benchmark</text>
  <text x="60" y="100" fill="#61706a" font-family="Arial, sans-serif" font-size="13">Inference path latency simulation</text>
  <line x1="104" y1="150.0" x2="864" y2="150.0" stroke="#d8e3de" stroke-width="1"/>
  <text x="92" y="154.0" text-anchor="end" fill="#61706a" font-family="Arial" font-size="12">507</text>
  <line x1="104" y1="222.5" x2="864" y2="222.5" stroke="#d8e3de" stroke-width="1"/>
  <text x="92" y="226.5" text-anchor="end" fill="#61706a" font-family="Arial" font-size="12">381</text>
  <line x1="104" y1="295.0" x2="864" y2="295.0" stroke="#d8e3de" stroke-width="1"/>
  <text x="92" y="299.0" text-anchor="end" fill="#61706a" font-family="Arial" font-size="12">254</text>
  <line x1="104" y1="367.5" x2="864" y2="367.5" stroke="#d8e3de" stroke-width="1"/>
  <text x="92" y="371.5" text-anchor="end" fill="#61706a" font-family="Arial" font-size="12">127</text>
  <line x1="104" y1="440.0" x2="864" y2="440.0" stroke="#d8e3de" stroke-width="1"/>
  <text x="92" y="444.0" text-anchor="end" fill="#61706a" font-family="Arial" font-size="12">0</text>
  <rect x="143.9" y="194.2" width="110.2" height="245.8" rx="12" fill="#2f9aa3"/>
  <text x="199.0" y="184.2" text-anchor="middle" fill="#172420" font-family="Arial" font-size="14" font-weight="800">430.0</text>
  <text x="199.0" y="474" text-anchor="middle" fill="#61706a" font-family="Arial" font-size="12">Cloud only</text>
  <rect x="333.9" y="294.3" width="110.2" height="145.7" rx="12" fill="#d6a74a"/>
  <text x="389.0" y="284.3" text-anchor="middle" fill="#172420" font-family="Arial" font-size="14" font-weight="800">255.0</text>
  <text x="389.0" y="474" text-anchor="middle" fill="#61706a" font-family="Arial" font-size="12">Hybrid</text>
  <rect x="523.9" y="354.3" width="110.2" height="85.7" rx="12" fill="#5b7fd6"/>
