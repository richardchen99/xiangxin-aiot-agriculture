  <text x="579.0" y="474" text-anchor="middle" fill="#61706a" font-family="Arial" font-size="12">Edge first</text>
  <rect x="713.9" y="376.0" width="110.2" height="64.0" rx="12" fill="#4f8f74"/>
  <text x="769.0" y="366.0" text-anchor="middle" fill="#172420" font-family="Arial" font-size="14" font-weight="800">112.0</text>
  <text x="769.0" y="474" text-anchor="middle" fill="#61706a" font-family="Arial" font-size="12">Cached edge</text>
  <line x1="104" y1="440" x2="864" y2="440" stroke="#314944" stroke-width="1.5"/>
  <text x="60" y="135" fill="#61706a" font-family="Arial" font-size="12">Latency ms</text>
